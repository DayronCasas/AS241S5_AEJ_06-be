name: Snyk - Security Analysis (SCA + SAST)

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch: # Permite ejecución manual desde GitHub Actions UI

env:
  JAVA_VERSION: '17'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Snyk SCA — Análisis de dependencias vulnerables (pom.xml)
  # ─────────────────────────────────────────────
  snyk-sca:
    name: Snyk SCA - Dependency Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      # 1. Checkout del código
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configurar Java 17
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # 3. Instalar Snyk CLI
      - name: Install Snyk CLI
        run: npm install -g snyk

      # 4. Autenticar con Snyk
      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      # 5. Escaneo SCA — dependencias Maven (genera SARIF)
      - name: Snyk SCA - Test Maven dependencies
        run: snyk test --file=pom.xml --package-manager=maven --sarif-file-output=snyk-sca.sarif
        continue-on-error: true # No bloquea el pipeline, solo reporta

      # 6. Crear SARIF vacío si Snyk no lo generó
      - name: Ensure snyk-sca.sarif exists
        run: |
          if [ ! -f snyk-sca.sarif ]; then
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Snyk","rules":[]}},"results":[]}]}' > snyk-sca.sarif
          fi

      # 7. Subir reporte SARIF al tab Security de GitHub
      - name: Upload Snyk SCA SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-sca

  # ─────────────────────────────────────────────
  # JOB 2: Snyk SAST — Análisis estático del código fuente
  # ─────────────────────────────────────────────
  snyk-sast:
    name: Snyk SAST - Code Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      # 1. Checkout del código
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Instalar Snyk CLI
      - name: Install Snyk CLI
        run: npm install -g snyk

      # 3. Autenticar con Snyk
      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      # 4. Escaneo SAST — análisis estático del código fuente Java
      - name: Snyk SAST - Code analysis
        run: snyk code test --sarif-file-output=snyk-sast.sarif
        continue-on-error: true # No bloquea el pipeline, solo reporta

      # 5. Crear SARIF vacío si Snyk no lo generó
      - name: Ensure snyk-sast.sarif exists
        run: |
          if [ ! -f snyk-sast.sarif ]; then
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"SnykCode","rules":[]}},"results":[]}]}' > snyk-sast.sarif
          fi

      # 6. Subir reporte SARIF al tab Security de GitHub
      - name: Upload Snyk SAST SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-sast.sarif
          category: snyk-sast

  # ─────────────────────────────────────────────
  # JOB 3: Snyk Monitor — Monitoreo continuo en Snyk Dashboard
  # ─────────────────────────────────────────────
  snyk-monitor:
    name: Snyk Monitor - Continuous Monitoring
    runs-on: ubuntu-latest
    needs: [snyk-sca, snyk-sast]
    if: github.event_name == 'push'

    steps:
      # 1. Checkout del código
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configurar Java 17
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # 3. Dar permisos al wrapper de Maven
      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # 4. Build del proyecto para que Snyk pueda resolver dependencias
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      # 5. Instalar Snyk CLI
      - name: Install Snyk CLI
        run: npm install -g snyk

      # 6. Autenticar con Snyk
      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      # 7. Monitorear proyecto en Snyk Dashboard (solo en push)
      - name: Snyk Monitor - Track project
        run: snyk monitor --file=pom.xml --package-manager=maven --project-name=AS241S5_AEJ_06-be
        continue-on-error: true
